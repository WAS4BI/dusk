<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dusk: site overrides</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 560px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 18px; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 9px 4px; border-bottom: 1px solid var(--line); }
    td.site { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; word-break: break-all; }
    td.mode { color: var(--muted); width: 80px; }
    td.act { width: 80px; text-align: right; }
    button.remove {
      font: inherit; font-size: 12px; color: var(--text); background: var(--panel);
      border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer;
    }
    button.remove:hover { border-color: var(--muted); }
    .empty { color: var(--muted); padding: 12px 4px; }
  </style>
</head>
<body>
  <h1>Site overrides</h1>
  <p class="lead">These sites use their own setting instead of the global Dark Mode switch.</p>
  <table><tbody id="list"></tbody></table>
  <p id="empty" class="empty" hidden>No overrides yet. Use "Override this site" in the popup.</p>
  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
